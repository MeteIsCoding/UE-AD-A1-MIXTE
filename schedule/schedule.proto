syntax = "proto3";

package schedule;

// On expose les opérations CRD des schedules
service Schedule {

  // Returj tous les schedules enregistrés
  rpc GetSchedules(EmptyRequest) returns (SchedulesResponse);

  // Retourne le schedule associé à une date
  rpc GetScheduleByDate(DateRequest) returns (ScheduleEntry);

  // Create un schedule pour une date
  rpc CreateSchedule(ScheduleEntry) returns (ScheduleEntry);

  // Supprime le schedule associé à une date
  rpc DeleteSchedule(DateRequest) returns (DeleteScheduleResponse);
}

// pour la lecture de tous les schedules
message EmptyRequest {
}

// Date utilisée pour rechercher ou delete un schedule
message DateRequest {
  string date = 1;
}

// Movies pour une date
message ScheduleEntry {
  string date = 1;
  repeated string movies = 2;
}

// Résultat du read de tous les schedules
message SchedulesResponse {
  repeated ScheduleEntry schedules = 1;
}

// Indique si schedule a bien été supprimé
message DeleteScheduleResponse {
  bool deleted = 1;
}