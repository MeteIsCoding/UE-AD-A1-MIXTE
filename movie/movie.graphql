type Query {
  all_movies: [Movie!]!
  movie_with_id(_id: String!): Movie
}

type Mutation {
  create_movie(
    _title: String!
    _director: String!
    _rating: Float!
  ): Movie!
  update_movie_rate(_id: String!, _rate: Float!): Movie
  delete_movie(_id: String!): Boolean!
}

type Movie {
  id: String!
  title: String!
  director: String!
  rating: Float!
  actors: [Actor!]!
}

type Actor {
  id: String!
  firstname: String!
  lastname: String!
  birthyear: Int!
  films: [String!]!
}